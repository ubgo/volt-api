name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is special - GitHub Actions auto-generates it with proper permissions. It only works inside GitHub's runners.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set build variables
        id: vars
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/Dockerfile.prod
          platforms: linux/amd64
          push: true
          # push: false
          # load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.vars.outputs.commit }}
            BRANCH=${{ steps.vars.outputs.branch }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          CONTAINER: ${{ env.CONTAINER_NAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REGISTRY: ${{ env.REGISTRY }}
          REPO_OWNER: ${{ github.repository_owner }}
          ENV_PROD_B64: ${{ secrets.ENV_PROD_B64 }}
          NSG_DEFAULT_CLI_ACC_2YFAMBMCZDRKEACJAG3XJPXEOEZ_PROD_KEY_B64: ${{ secrets.NSG_DEFAULT_CLI_ACC_2YFAMBMCZDRKEACJAG3XJPXEOEZ_PROD_KEY_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DEPLOY_PATH,IMAGE,CONTAINER,GHCR_PAT,REGISTRY,REPO_OWNER,ENV_PROD_B64,NSG_DEFAULT_CLI_ACC_2YFAMBMCZDRKEACJAG3XJPXEOEZ_PROD_KEY_B64
          script: |
            set -e

            echo "==> Creating directories..."
            mkdir -p ${DEPLOY_PATH}/_keys
            mkdir -p ${DEPLOY_PATH}/logs

            echo "==> Fixing permissions for logs directory (container runs as UID 1000)..."
            chown -R 1000:1000 ${DEPLOY_PATH}/logs

            echo "==> Writing .env.prod..."
            echo "${ENV_PROD_B64}" | base64 -d > ${DEPLOY_PATH}/.env.prod
            chmod 600 ${DEPLOY_PATH}/.env.prod

            echo "${NSG_DEFAULT_CLI_ACC_2YFAMBMCZDRKEACJAG3XJPXEOEZ_PROD_KEY_B64}" | base64 -d > ${DEPLOY_PATH}/_keys/nsg-default-cli-acc_2YFaMBmczDRkEacjAG3XjPXeOEz_prod.creds
            chmod 600 ${DEPLOY_PATH}/_keys/*
            chown -R 1000:1000 ${DEPLOY_PATH}/_keys

            echo "==> Logging in to registry..."
            echo "${GHCR_PAT}" | docker login ${REGISTRY} -u ${REPO_OWNER} --password-stdin

            echo "==> Pulling latest image..."
            docker pull ${IMAGE}

            echo "==> Stopping old container (waiting for graceful shutdown)..."
            docker stop ${CONTAINER} 2>/dev/null || true
            docker rm ${CONTAINER} 2>/dev/null || true

            echo "==> Reading PORT from .env.prod..."
            PORT=$(grep -E '^PORT=' ${DEPLOY_PATH}/.env.prod | cut -d '=' -f2 | tr -d ' ' || echo "2315")

            # --stop-timeout 86400 (24h) allows cron jobs to complete during deployments.
            # Max job runtime: 12h. See docs/incidents/2025-01-18-cron-graceful-shutdown.md
            echo "==> Starting new container on port ${PORT}..."
            docker run -d \
              --name ${CONTAINER} \
              --restart unless-stopped \
              --stop-timeout 86400 \
              --network host \
              --env-file ${DEPLOY_PATH}/.env.prod \
              -v ${DEPLOY_PATH}/_keys:/app/_keys:ro \
              -v ${DEPLOY_PATH}/logs:/app/tmp/logs \
              ${IMAGE}

            echo "==> Waiting for container to be ready..."
            sleep 5

            echo "==> Running database migrations..."
            docker exec ${CONTAINER} /app/cli migrate

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deployment complete!"
            docker ps | grep ${CONTAINER}
