[supervisord]
nodaemon=true
logfile=/app/tmp/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/app/tmp/logs

[unix_http_server]
file=/tmp/supervisord.sock

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; =============================================================================
; GRACEFUL SHUTDOWN CONFIG
; =============================================================================
; We use 24h (86400s) timeout to allow running jobs to complete before shutdown.
; This applies during deployments and container restarts.
;
; Chain of timeouts (all must be >= max job runtime):
;   docker --stop-timeout (86400s) -> supervisor stopwaitsecs (86400s) -> gocron WithStopTimeout (24h)
;
; Max allowed job runtime: 12 hours (see CODING_STANDARDS.md)
; See docs/incidents/2025-01-18-cron-graceful-shutdown.md for details.
; =============================================================================

[program:api]
command=/app/api
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/app/tmp/logs/api.err.log
stdout_logfile=/app/tmp/logs/api.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=10
stopsignal=SIGTERM
stopwaitsecs=86400

[program:cron]
command=/app/cron
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/app/tmp/logs/cron.err.log
stdout_logfile=/app/tmp/logs/cron.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=20
stopsignal=SIGTERM
stopwaitsecs=86400
