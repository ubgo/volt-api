[unix_http_server]
file=/run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root


[program:api]
command=air
directory=/app/saas
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
redirect_stderr=false
autostart=true
autorestart=true
startsecs=5
priority=10
stopsignal=SIGTERM
stopwaitsecs=86400

; =============================================================================
; GRACEFUL SHUTDOWN CONFIG
; =============================================================================
; We use 24h (86400s) timeout to allow running jobs to complete before shutdown.
;
; Chain of timeouts (all must be >= max job runtime):
;   docker stop_grace_period (24h) -> supervisor stopwaitsecs (86400s) -> gocron WithStopTimeout (24h)
;
; Max allowed job runtime: 12 hours (see CODING_STANDARDS.md)
; See docs/incidents/2025-01-18-cron-graceful-shutdown.md for details.
;
; NOTE: Using pre-built binary, not "go run", because go run doesn't forward SIGTERM.
; =============================================================================

[program:cron]
command=go run ./cmd/cron/main.go
; command=/app/saas/bin/cron
directory=/app/saas
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
redirect_stderr=false
autostart=true
autorestart=true
startsecs=10
priority=20
stopsignal=SIGTERM
stopwaitsecs=86400
