# https://taskfile.dev

version: "3"

# dotenv: ['.env']

tasks:
  default:
    cmds:
      - task --list-all
    silent: true

  update:
    desc: upgrade all the go modules
    cmds:
      - go get -u ./...
      - go mod tidy

  gql:
    desc: generate gqlgen code from schema files
    cmds:
      - go run github.com/99designs/gqlgen generate
