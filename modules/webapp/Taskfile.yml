# https://taskfile.dev

version: "3"

# dotenv: ['.env']

tasks:
  default:
    cmds:
      - task --list-all
    silent: true

  update:
    desc: upgrade all the go modules
    cmds:
      - go get -u ./...
      - go mod tidy

  build:
    desc: create build files saas, api, cli
    cmds:
      - go build -o ../tmp/bin/api ./cmd/api
      - go build -o ../tmp/bin/cli ./cmd/cli
      - go build -o ../tmp/bin/cron ./cmd/cron
  dev:
    desc: run air (port from $PORT or the compiled-in default), tee → ../tmp/air.log
    cmds:
      - air 2>&1 | tee ../tmp/air.log

  dev:portless:
    desc: run air via portless → https://volt-api.localhost (logs → ../tmp/air.log)
    cmds:
      - mkdir -p ../tmp
      - portless run air 2>&1 | tee ../tmp/air.log
